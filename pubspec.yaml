name: my_flutter_app
description: "Payment Services UI App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.1.1

  # State management
  provider: ^6.1.2

  # API calling
  http: ^1.2.2

  # Icons (modern UI)
  flutter_svg: ^2.0.10

  # Google fonts (clean UI)
  google_fonts: ^6.2.1

  intl: ^0.20.2
  local_auth: ^2.1.8
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ✅ launcher icon generator should be in dev_dependencies
  flutter_launcher_icons: ^0.13.1

# ✅ launcher icons config must be OUTSIDE dependencies blocks
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/bharatconnect.png
    - assets/images/BharatConnectLogo_PNG.png
    